name: Windows skills synchronization
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The suites run as parallel jobs (each has its own machine); the slowest part sets the pace.
  # Each part runs its suites one after another and fails if any of them fails.
  suites:
    name: ${{ matrix.part }} (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        part: [coordinator-1, coordinator-2, integration, governance]
        include:
          - part: coordinator-1
            suites: 'update-coordinator -Shard 1/2'
          - part: coordinator-2
            suites: 'update-coordinator -Shard 2/2'
          - part: integration
            suites: 'skills-sync -IncludeLinkTest; windows-integration; project-migration; release-policy; commit'
          - part: governance
            suites: 'harness-radar; project-hygiene; secret-guard; run-tests; turn-gate; pre-commit; repo-hygiene; rules-check; user-profile; learning-proposals; session-checkpoint; session-start; wait-ci; local-release; acceptance; activity-log; instruction-harvest; hub-reconfigure; versioning'
    env:
      AGENT_OPS_TEST_SHELL: ${{ matrix.shell }}
      AGENT_OPS_SUITES: ${{ matrix.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test suites of this part
        shell: pwsh
        run: |
          $failed=@()
          foreach($entry in @($env:AGENT_OPS_SUITES -split ';'|ForEach-Object {$_.Trim()}|Where-Object {$_})){
            $words=@($entry -split ' '|Where-Object {$_});$extra=@($words|Select-Object -Skip 1)
            Write-Host "::group::$entry"
            & $env:AGENT_OPS_TEST_SHELL -NoProfile -ExecutionPolicy Bypass -File "./tests/$($words[0]).tests.ps1" @extra
            $code=$LASTEXITCODE
            Write-Host '::endgroup::'
            if($code -ne 0){$failed+=$entry;Write-Host "::error::$entry failed (exit $code)"}
          }
          if($failed.Count){Write-Host ('Failed: '+($failed -join ', '));exit 1}
      - name: Versioning of the pushed commits
        if: matrix.part == 'governance'
        shell: pwsh
        run: |
          & $env:AGENT_OPS_TEST_SHELL -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-versioning.ps1 -RepositoryPath . -Base HEAD~1 -Head HEAD
          exit $LASTEXITCODE
      - name: Check the exact committed public package
        if: matrix.part == 'governance'
        shell: pwsh
        run: |
          & $env:AGENT_OPS_TEST_SHELL -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-release.ps1 -Commit $env:GITHUB_SHA
          exit $LASTEXITCODE
  # The checks stable requires keep their names. A skipped job counts as passed, so this one always runs
  # and passes only when every part above succeeded.
  test:
    name: test (${{ matrix.shell }})
    needs: suites
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Every part of the tests passed
        shell: bash
        run: |
          echo "Parts: ${{ needs.suites.result }}"
          test "${{ needs.suites.result }}" = success
  promote:
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Promote only this tested SHA without forcing the channel
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(git ls-remote origin refs/heads/stable | awk '{print $1}')"
          if [ -n "$current" ]; then
            [[ "$current" =~ ^[a-f0-9]{40}$ ]]
            git fetch origin refs/heads/stable
            if git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
              echo 'Stable already contains this tested commit; no downgrade.'
              exit 0
            fi
            git merge-base --is-ancestor "$current" "$GITHUB_SHA"
          fi
          # Right after the tests finish, branch protection can still see them "in progress" for a few
          # seconds. Retry only that rejection, a bounded number of times; anything else fails at once.
          for attempt in 1 2 3 4 5 6; do
            if out="$(git push origin "$GITHUB_SHA:refs/heads/stable" 2>&1)"; then echo "$out"; exit 0; fi
            echo "$out"
            if ! printf '%s' "$out" | grep -q 'is in progress'; then exit 1; fi
            echo "Required checks still reported in progress (attempt $attempt); retrying in 10 s."
            sleep 10
          done
          exit 1
